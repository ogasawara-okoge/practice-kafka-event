version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'Mk3OEYBSD3T24T8rKRMdww=='
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 10s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    user: "root"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      cub kafka-ready -b kafka:29092 1 20 &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic order-events
      "

  shop:
    build: ./shop
    ports:
      - "3001:3001"
    env_file:
      - ./shop/.env.local
    depends_on:
      - order-api

  order-api:
    build:
      context: .
      dockerfile: order-api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./order-api/.env
    volumes:
      - ./order-api:/app
      - /app/node_modules
      - ./infrastructure:/app/infrastructure
    command: npm run dev
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  order-processor:
    build: ./order-processor
    env_file:
      - ./order-processor/.env
    command: npm run dev
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  mail-service:
    build: ./mail-service
    env_file:
      - ./mail-service/.env
    command: npm run dev
    depends_on:
      kafka-setup:
        condition: service_completed_successfully